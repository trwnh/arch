user http;
worker_processes auto;

# Load all installed modules
include modules.d/*.conf;

events {
	worker_connections 1024;
}

http {

	# MIME types
	include mime.types;  # load registered defaults
	types {  # augment with additional extension mappings
		text/turtle ttl;
		application/n-triples nt;
		application/n-quads nq;
		application/xrd+xml xrd;
		application/rdf+xml rdf;
		application/jrd+json jrd;
		application/activity+json activity;
		application/cid cid;
		application/did did;
	}
	default_type application/octet-stream;
	types_hash_max_size 4096;
	
	# Set logging defaults

	log_format main
		'$remote_addr - $remote_user [$time_local] "$request" '
		'$status $body_bytes_sent "$http_referer" '
		'"$http_user_agent" "$http_x_forwarded_for"';

	log_format messages-irclike
		'[$time_iso8601] <$http_from> $request_body';

	log_format messages-turtlelike
		'<#$request_id> :date "$time_iso8601"^^xsd:datetime; '
		':from "$http_from"; '
		':content "$request_body".';

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	# Optimize for serving static files by default
	sendfile on;
	tcp_nopush on;
	keepalive_timeout  65;
	if_modified_since before;

	# Enable compression
	gzip  on;
	gzip_comp_level 6;
	gzip_vary on;
	gzip_min_length 1000;
	gzip_proxied
		expired
		no-cache
		no-store
		private
		auth;
	gzip_types
		text/plain

		text/turtle
		application/trig
		application/n-triples
		application/n-quads

		application/json
		application/jrd+json
		application/ld+json
		application/activity+json
		application/cid
		application/did
		application/did+json
		application/feed+json
		application/jf2feed+json
		application/jf2+json

		application/xml
		application/xrd+xml
		application/rdf+xml
		application/rss+xml
		application/atom+xml
		text/xml

		text/css

		text/javascript
		text/js
		application/javascript
		application/x-javascript

		font/ttf
		font/otf
		application/vnd.ms-fontobject

		image/svg+xml;

	# Enable HTTP/2
	http2 on;

	# Security tweaks
	auth_delay 1s;
	disable_symlinks if_not_owner;

	# Load additional configuration for enabled sites
	include conf.d/*.conf;
	include sites/*.conf;

}
